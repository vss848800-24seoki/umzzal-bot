# 아이돌 움짤 자동 게시 (GitHub 서버에서 실행 → 맥이 꺼져 있어도 동작)
# 15분마다 확인 → 날마다 정해진 랜덤 개수(20~30)·24시간 랜덤 시각 중 지난 만큼 게시 (2026-10-18 제프)
name: umzzal

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "시각 상관없이 지금 바로 1개 등록"
        type: boolean
        default: false

permissions:
  contents: write   # 처리 기록(posted.json·schedule.json) 저장용

concurrency:
  group: umzzal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 프로그램 설치
        run: pip install -q requests

      - name: 움짤 게시
        env:
          NUDETV_ADMIN_ID: ${{ secrets.NUDETV_ADMIN_ID }}
          NUDETV_ADMIN_PW: ${{ secrets.NUDETV_ADMIN_PW }}
          INPUT_NOW: ${{ github.event.inputs.now }}
        run: |
          if [ "$INPUT_NOW" = "true" ]; then
            python3 umzzal_post.py --submit
          else
            python3 umzzal_post.py --auto
          fi

      - name: 처리 기록 저장
        if: always()
        run: |
          git config user.name "umzzal-bot"
          git config user.email "umzzal-bot@users.noreply.github.com"
          git add posted.json schedule.json
          git diff --cached --quiet && exit 0
          git commit -q -m "게시 기록 갱신"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
